{% extends "base.html" %}

{% block title %}Compare | SpoonFeed{% endblock %}

{% block content %}
    <header class="page-header">
        <div>
            <a href="/" class="back-link">← Back to Discover</a>

            <h1 class="page-title page-title-lg">Compare</h1>

            <p class="page-subtitle">
                Compare up to three products side by side.
            </p>
        </div>
    </header>

    <section class="card">
        <div class="empty-state">
            <h2 class="empty-state-title">
                No comparison available yet
            </h2>

            <p class="empty-state-text">
                Select two or three products from Discover to compare them.
            </p>

            <a href="/" class="btn btn-primary">
                Browse products
            </a>
        </div>
    </section>
{% endblock %}
