<dialog
        id="compare-remove-dialog"
        class="dialog"
        aria-labelledby="compare-remove-title"
        aria-describedby="compare-remove-description"
    >
        <div class="dialog-header">
            <h2 id="compare-remove-title" class="dialog-title">
                Remove product?
            </h2>
        </div>

        <p id="compare-remove-description" class="dialog-text">
            Remove
            <strong id="compare-remove-product-name"></strong>
            from this comparison? You can add it again from Discover.
        </p>

        <form id="compare-remove-form" method="post">
            {% csrf_token %}

            <div class="dialog-actions">
                <button
                    type="button"
                    id="compare-remove-cancel"
                    class="btn btn-secondary"
                    autofocus
                >
                    Cancel
                </button>

                <button type="submit" class="btn btn-danger">
                    Remove
                </button>
            </div>
        </form>
    </dialog>
