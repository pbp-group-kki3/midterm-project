<div
    id="toast-component"
    class="alert alert-info compare-toast toast-hidden"
    popover="manual"
>
    <span class="compare-toast-badge" aria-hidden="true">
        <span id="toast-symbol" class="compare-toast-letter">i</span>
    </span>

    <div class="compare-toast-content" role="status" aria-atomic="true">
        <span id="toast-title" class="sr-only"></span>
        <p id="toast-message" class="compare-toast-message"></p>
    </div>

    <button
        type="button"
        id="toast-close"
        class="compare-toast-close"
        aria-label="Dismiss notification"
    >
        <span class="icon icon-x" aria-hidden="true"></span>
    </button>
</div>

<div id="compare-toast-messages" hidden>
    {% for message in messages %}
        <span
            data-message="{{ message }}"
            data-type="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}error{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}warning{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}success{% else %}normal{% endif %}"
        ></span>
    {% endfor %}
</div>
