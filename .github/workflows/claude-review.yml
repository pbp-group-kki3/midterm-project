# change: new workflow so every PR into main automatically gets a review from Claude, alongside our human peer review
# Put this file at: .github/workflows/claude-review.yml
# GitHub runs every .yml in .github/workflows/ automatically. It's a brand-new
# folder in our repo, so it can't conflict with anyone's module code.

# The name shown in the PR "Checks" tab and the Actions tab.
name: AI Code Review (Claude)

# WHEN this runs: on pull requests only, never on plain pushes.
on:
  pull_request:
    # opened      = someone creates the PR
    # synchronize = someone pushes new commits to an open PR (re-review the fix)
    # ready_for_review = a draft PR gets marked ready
    # reopened    = a closed PR comes back
    types: [opened, synchronize, ready_for_review, reopened]
    # Only PRs going into main get reviewed (all of ours do, but this keeps it explicit).
    branches: [main]

# If someone pushes 3 commits quickly, cancel the older review runs and keep
# only the newest one, so we don't burn usage on outdated code.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs: they're unfinished, a review would just be noise.
    if: github.event.pull_request.draft == false
    # A fresh Linux machine from GitHub. Free and unlimited on public repos.
    runs-on: ubuntu-latest
    # Stop a stuck run after 15 minutes instead of hanging forever.
    timeout-minutes: 15

    # Least privilege: the bot can READ the code and WRITE PR comments, nothing else.
    # It cannot push commits or merge anything.
    permissions:
      contents: read        # read the files in the repo
      pull-requests: write  # post review comments on the PR
      id-token: write       # lets the action authenticate itself to GitHub

    steps:
      # Step 1: download the PR's code onto the runner so Claude can read it.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1    # only the latest commit, faster than the full history

      # Step 2: run Anthropic's official action, pinned to major version 1.
      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Auth. Use ONE of these two lines:
          #  - claude_code_oauth_token: uses a Claude Pro/Max subscription
          #    (make it with `claude setup-token` on your laptop)
          #  - anthropic_api_key: pay-per-use key from console.anthropic.com
          # Either way the value lives in repo Settings > Secrets, never in this file.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Shows a checklist comment on the PR that ticks off as the review runs.
          track_progress: true

          # The instructions. Written around our stack and the midterm rubric,
          # so the review checks what the graders check.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for SpoonFeed, a university group
            project: a Django (MTV) web app that uses the Open Food Facts API.
            Each teammate owns one Django app (main, profiles, meal_plan,
            comparison, food_of_the_day, blog). Read STYLE_GUIDE.md first.

            Review ONLY the changes in this PR. Focus on:
            1. Correctness: bugs, unhandled edge cases, broken URLs or imports.
            2. Security: views that let a user edit or delete someone else's data
               (should return 403), missing @login_required, missing CSRF on
               forms or AJAX/HTMX requests, secrets committed to the repo.
            3. Django practice: form/model validation, N+1 queries (suggest
               select_related/prefetch_related), external API calls without a
               timeout or without handling the API being down.
            4. Tests: new views/forms/models without tests in tests.py.
            5. Frontend: pages that don't extend base.html, or colors/spacing
               hard-coded instead of using the shared CSS tokens in the style guide.

            Rules:
            - Put specific problems as inline comments on the exact line.
            - Finish with ONE summary comment: what's good, then issues ranked
              Must fix / Should fix / Nice to have.
            - Be concise and kind; the authors are students. Explain WHY
              something is a problem, and show a short fix when you can.
            - Don't comment on pure formatting, and don't invent issues.

          # What Claude is allowed to do on the runner: read the PR diff/details
          # and post comments. Nothing that changes code.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
