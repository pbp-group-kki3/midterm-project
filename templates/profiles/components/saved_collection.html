<!-- TOAST COMPONENT: Main UI container for floating notifications, uses the native HTML popover API -->
<div
    id="toast-component"
    class="alert alert-info toast toast-hidden" hidden
    popover="manual"
>
    <!-- Icon badge for the toast (e.g., info 'i', success check, etc.) -->
    <span class="toast-badge" aria-hidden="true">
        <span id="toast-symbol" class="toast-letter">i</span>
    </span>

    <!-- Message container with accessibility roles for screen readers -->
    <div class="toast-content" role="status" aria-atomic="true">
        <span id="toast-title" class="sr-only"></span>
        <p id="toast-message" class="toast-message"></p>
    </div>

    <!-- Dismiss button to manually close the toast -->
    <button
        type="button"
        id="toast-close"
        class="toast-close"
        aria-label="Dismiss notification"
    >
        <span class="icon icon-x" aria-hidden="true"></span>
    </button>
</div>

<!-- DJANGO MESSAGES INJECTION: Loops through backend messages and stores them in DOM data attributes. Frontend JavaScript will read these hidden spans to dynamically trigger the toast UI above. -->
<div id="toast-messages" hidden>
    {% for message in messages %}
        <span
            data-message="{{ message }}"
            data-type="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}error{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}warning{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}success{% else %}normal{% endif %}"
        ></span>
    {% endfor %}
</div>
