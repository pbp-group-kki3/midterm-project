{# "Coming soon" card for modules that aren't built yet. Needs: title, blurb #}
<section class="coming-soon">
    <div class="card card-elevated coming-soon-card">
        {% include 'components/spoon_sprout.html' %}
        <span class="badge badge-warning">Coming soon</span>
        <h1 class="type-h1">{{ title }}</h1>
        <p class="type-body-md">{{ blurb }}</p>
        <a href="/modules/" class="btn btn-primary btn-pill">Back to all modules</a>
    </div>
</section>
